[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegap-qa"
version = "0.6.0"
description = "Hardware-oriented quantum circuit co-design and finite-shot local-witness certification framework."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Abdelmalik Berrada"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "networkx>=3.2",
  "pandas>=2.2",
  "tqdm>=4.66"
]

[project.optional-dependencies]
exact = ["ortools>=9.10"]
parquet = ["pyarrow>=16"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
qpu = ["openquantum-sdk[qiskit]", "qiskit>=2.0"]
cuda = []
cuda12 = ["cupy-cuda12x>=13"]
cuda13 = ["cupy-cuda13x>=14"]
build = ["build>=1.2", "cibuildwheel>=2.20"]
tensor = ["cotengra>=0.8"]

[project.scripts]
codegap = "codegap_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
